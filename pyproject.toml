[project]
name = "pyccc"
version = "0.1.0"
description = "CellChat-like cell-cell communication analysis and plotting for Scanpy/AnnData."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "pyccc contributors" }]
license = { file = "LICENSE" }
keywords = ["single-cell", "cell-cell communication", "CellChat", "AnnData", "Scanpy"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "adjusttext>=1.2",
    "anndata>=0.10",
    "matplotlib>=3.8",
    "networkx>=3.2",
    "numpy>=1.24",
    "pandas>=2.0",
    "rdata>=0.11.2",
    "scanpy>=1.10",
    "scikit-learn>=1.3",
    "scipy>=1.10",
    "seaborn>=0.13",
]

[project.optional-dependencies]
liana = ["liana>=1.3"]
dev = ["pytest>=8.0"]
docs = [
    "myst-parser>=2.0",
    "sphinx>=7.0",
    "sphinx-copybutton>=0.5",
]
ggplot = [
    "plotnine>=0.13",
]
interactive = [
    "plotly>=5.20",
]
omnipath = ["omnipath>=1.0"]
predict = [
    "torch>=2.2",
    "transformers>=4.45",
    "huggingface-hub>=0.24",
    "scikit-learn>=1.4",
    "lightgbm>=4.0",
    "joblib>=1.3",
]

[project.urls]
Homepage = "https://github.com/cheneyyu/pyccc"
Repository = "https://github.com/cheneyyu/pyccc"
Issues = "https://github.com/cheneyyu/pyccc/issues"
Documentation = "https://github.com/cheneyyu/pyccc#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pyccc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "predict: tests that require the experimental prediction extra",
    "spatial: tests for spatial validation utilities",
    "network: tests that require live network access",
    "gpu: tests that require a GPU",
    "slow: long-running benchmark or model tests",
]
